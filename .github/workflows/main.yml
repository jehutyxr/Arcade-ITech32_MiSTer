name: Compile MiSTer Core

on:
  workflow_dispatch: # Ermöglicht den manuellen Start über den Actions-Reiter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Quartus Compilation
        uses: raetro/quartus-flow@v1
        with:
          project: 'Arcade-ITech32'  # Name deiner .qpf Datei
          version: '17.1'            # Nutzt das kompatible Quartus 17.1 Image
          project_folder: '.'        # Projekt liegt im Hauptverzeichnis

      - name: Upload RBF File
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-ITech32-RBF
          path: output_files/Arcade-ITech32.rbf
